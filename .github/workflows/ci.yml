name: Source and CPU regression tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m tessfold --help
      - run: python -m pytest
      - run: python scripts/audit_source_repo.py
